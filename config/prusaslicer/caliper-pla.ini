# CALIPER — Livello 4, profilo PrusaSlicer (PLA)
#
# Versionato nel repository, non uno stato nascosto in una GUI (vedi
# docs/architettura-prototipo-mesh-llm.md, Livello 4 [v6]).
#
# Uso: prusa-slicer-console --export-gcode --load caliper-pla.ini modello.stl -o output.gcode
#
# STATO: default iniziali, negoziabili (vedi Rischio #4). La temperatura
# resta esplicitamente NON impostata finche' materiale e marca del
# filamento non sono decisi — fissarla ora creerebbe un parametro
# congelato ma arbitrario invece che derivato dal materiale realmente
# usato. Il verificatore (Livello 3) non dipende da questo profilo.

layer_height = 0.2
perimeters = 3
fill_density = 20%
nozzle_diameter = 0.4
filament_type = PLA

