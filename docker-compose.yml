name: caliper

# ------------------------------------------------------------------------
# Reti: isolate dove non serve comunicazione, condivise dove serve.
#
#   caliper-ai      -> ollama, qdrant, flowise, stream-agent, open-webui.
#                      Comunicano davvero fra loro (Flowise/stream-agent
#                      leggono Ollama e Qdrant; Open WebUI parla con
#                      stream-agent via endpoint OpenAI-compatible e con
#                      Ollama via la sua connessione nativa).
#   caliper-public  -> solo landing-page. Pagina statica con link, non ha
#                      bisogno di raggiungere nessun altro container.
#   prusaslicer     -> network_mode: none. CLI batch, solo file, nessuna
#                      rete necessaria in nessuna direzione.
#   verifier-executor -> network_mode: none. Esegue codice CadQuery
#                      generato da un LLM (non fidato): nessuna rete ne'
#                      in ne' out, comunica col verifier SOLO tramite il
#                      volume verifier_exec (file di job/risultato), mai
#                      HTTP diretto.
#   dashboard       -> UNICA eccezione multi-homed: sta su caliper-ai E
#                      caliper-public. Deve leggere lo stato degli altri
#                      servizi (server-side, evita CORS) e i log tramite
#                      docker-socket-proxy — non e' piu' una pagina
#                      puramente statica come la vecchia landing-page.
#   docker-socket-proxy -> unico container che tocca
#                      /var/run/docker.sock. CONTAINERS=1 e LOGS=1 (solo
#                      GET su lista/inspect/log), POST=0 blocca ogni
#                      azione di scrittura (niente start/stop/restart/
#                      exec/create/delete) — la dashboard non ha ne' offre
#                      controlli del genere, per scelta esplicita (vedi
#                      Rischio in docs/architettura-prototipo-mesh-llm.md).
#                      Nessuna porta pubblicata verso l'host: raggiungibile
#                      solo dalla dashboard, sulla rete caliper-ai.
# ------------------------------------------------------------------------

networks:
  caliper-ai:
  caliper-public:

volumes:
  ollama_data:
  qdrant_data:
  flowise_data:
  open_webui_data:
  verifier_exec:
  stream_agent_state:

services:

  # ---------------- Livello 7 — vector store ----------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: caliper-qdrant
    restart: unless-stopped
    networks: [caliper-ai]
    ports:
      # [M5, C10 — vedi docs/review_tecnica.md] Bind su 127.0.0.1: prima
      # di M5 la porta era pubblicata su TUTTE le interfacce (0.0.0.0
      # implicito), raggiungibile da chiunque sulla rete dell'host senza
      # autenticazione. Qdrant/Ollama/verifier/stream-agent non hanno
      # bisogno di essere raggiunti da fuori l'host (solo per ispezione
      # umana locale, es. curl/debug) — flowise/open-webui/dashboard
      # restano su tutte le interfacce perche' sono le UI pensate per
      # accesso da browser, anche da altre macchine sulla rete locale.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ---------------- Livello 7 — modelli locali ----------------
  ollama:
    image: ollama/ollama:latest
    container_name: caliper-ollama
    restart: unless-stopped
    networks: [caliper-ai]
    ports:
      # [M5, C10] Bind 127.0.0.1 — vedi nota su qdrant sopra.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Richiede NVIDIA Container Toolkit installato sull'host (vedi
    # nvidia-smi: RTX 5080 16GB, verificata disponibile e quasi libera).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ---------------- Livello 7 — grounding agent ----------------
  # Adattato da NORTHSTREAM (vedi Rischio #10): indicizza il Livello 6
  # da disco invece di consumare uno stream Kafka. Codice in
  # services/stream-agent/ — vedi app.py per il dettaglio dell'adattamento.
  # [M4] Secondo mount read-only per il log del collaudo virtuale
  # (retry_log.jsonl esteso, vedi services/orchestrator/retry_policy.py):
  # collezione Qdrant separata da quella del Livello 6, mai fusa (vedi
  # docs/logbook_fase4.md, "due collezioni separate"). L'orchestratore
  # (services/orchestrator/, script esterno non containerizzato — vedi
  # generate_and_verify.py) scrive il log fuori da questo compose: per
  # farlo comparire qui, puntare RETRY_LOG_PATH lato orchestratore dentro
  # ${DATA_DIR:-./data}/virtual_log/retry_log.jsonl.
  stream-agent:
    build: ./services/stream-agent
    container_name: caliper-stream-agent
    restart: unless-stopped
    networks: [caliper-ai]
    ports:
      # [M5, C10] Bind 127.0.0.1 — vedi nota su qdrant sopra.
      - "127.0.0.1:8500:8500"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-granite4:1b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-granite-embedding:30m}
      DATASET_DIR: /data/dataset
      VIRTUAL_LOG_PATH: /data/virtual_log/retry_log.jsonl
      # [M7, C6] Giuntura mai esercitata: /data/virtual_log e' read-only
      # per scelta (l'indexer non deve poter toccare il log
      # dell'orchestratore), ma il file di offset che rende
      # l'indicizzazione incrementale sopravvissuta ai riavvii (fix
      # C6) e' un sidecar SCRITTO accanto al log — su RunPod (M6) quel
      # path era nativo e scrivibile, mai testato dentro un bind mount
      # :ro finora. VIRTUAL_LOG_OFFSET_PATH era gia' overridabile via
      # env (nessun cambio al codice): lo spostiamo su un volume
      # dedicato scrivibile.
      VIRTUAL_LOG_OFFSET_PATH: /data/state/retry_log.jsonl.offset
      POLL_INTERVAL_SECONDS: "30"
    volumes:
      - ${DATA_DIR:-./data}/dataset:/data/dataset:ro
      - ${DATA_DIR:-./data}/virtual_log:/data/virtual_log:ro
      - stream_agent_state:/data/state
    depends_on:
      - ollama
      - qdrant

  # ---------------- Livello 3 — verificatore ----------------
  # Script deterministico, NON un nodo Flowise (Rischio #9): richiamabile
  # via HTTP dall'orchestratore esterno (services/orchestrator/), non da
  # un Custom Tool dentro Flowise — vedi note su quel bug in
  # docs/architettura-prototipo-mesh-llm.md. Controllo statico sempre;
  # esecuzione+misura delegata a verifier-executor via volume condiviso.
  verifier:
    build: ./services/verifier
    container_name: caliper-verifier
    restart: unless-stopped
    networks: [caliper-ai]
    ports:
      # [M5, C10 — vedi docs/review_tecnica.md] Bind 127.0.0.1: prima di
      # M5 questa porta era pubblicata su tutte le interfacce senza
      # autenticazione — il verifier accetta codice CadQuery arbitrario
      # da chiunque la raggiunga (/verify esegue exec(code), vedi
      # run_and_measure.py). Nessun servizio esterno all'host deve
      # poterla raggiungere.
      - "127.0.0.1:8600:8600"
    volumes:
      - verifier_exec:/exec
    depends_on:
      - verifier-executor

  # ---------------- Livello 3 — esecutore isolato ----------------
  # Esegue codice CadQuery generato da un LLM: non fidato per
  # definizione. network_mode: none (nessuna rete, ne' in ne' out) —
  # comunica col verifier SOLO tramite il volume verifier_exec (file di
  # job/risultato), mai HTTP diretto. Limiti di CPU/memoria per singolo
  # job dentro run_and_measure.py, non solo a livello container.
  # [M1] Due mount read-only aggiuntivi per il gauge-check (calibri
  # Go/No-Go virtuali, vedi docs/logbook_fase1.md): "models" per i pezzi
  # STEP noti/statici da verificare (stesso DATA_DIR gia' usato da
  # prusaslicer), "gauges" per i calibri versionati in git
  # (config/gauges/, MAI generati dall'IA — vedi README li'). Nessuna
  # nuova rotta HTTP: gauge_check.py legge questi path direttamente dal
  # filesystem del container, il job/result passa solo i path relativi
  # (vedi services/verifier/executor/gauge_check.py).
  verifier-executor:
    build: ./services/verifier/executor
    container_name: caliper-verifier-executor
    restart: unless-stopped
    network_mode: "none"
    # [M7, C8] Rimisurato dal vivo in QUESTA topologia (regola #3 del
    # piano: i numeri di M6 non si trasferiscono per assunzione) — e
    # infatti non si sono trasferiti. RLIMIT_CPU somma il tempo di TUTTI
    # i thread combinati: con 32 core reali (bare metal, non un pod
    # oversubscribed) l'aggregato cresce molto piu' in fretta che sul pod
    # RunPod di M6 a parita' di lavoro reale (stesso pezzo, stesso sweep,
    # wall-clock quasi identico ~20s vs ~37s qui per il gauge-check GO —
    # e' la CPU totale che diverge, ~91s in M6 contro ~268s misurati qui).
    # CALIPER_AS_LIMIT_MB: anche il default 2048 "tarato per
    # docker-compose" (vedi commento in run_and_measure.py) si e'
    # rivelato insufficiente qui dal vivo (SIGSEGV, exit 139) — il
    # commento nel codice era una previsione mai verificata in un
    # container reale prima d'ora, non un fatto. Valori: worst-case
    # misurato x1.5, stessa convenzione di E2E-8/M6.
    environment:
      CALIPER_AS_LIMIT_MB: "16384"
      CALIPER_STACK_LIMIT_MB: "2"
      CALIPER_CPU_LIMIT_S: "25"
      GAUGE_CHECK_CPU_LIMIT_SECONDS: "405"
    volumes:
      - verifier_exec:/exec
      - ${DATA_DIR:-./data}/models:/models:ro
      - ./config/gauges:/gauges:ro

  # ---------------- Motore di esecuzione — L1, L2.5, L2, L7-consultivo ----------------
  # Le API key dei provider LLM (OpenAI/Gemini/Claude) si configurano
  # dentro la UI di Flowise come credenziali cifrate (FLOWISE_SECRETKEY_OVERWRITE),
  # non come variabili d'ambiente del container — quelle in .env.example
  # sono di riferimento per eventuali script esterni (L3, ecc.).
  flowise:
    # [M5, C10 — vedi docs/review_tecnica.md] Pinnata a una versione
    # esplicita invece di "latest": un riavvio del pod/host puo' tirare
    # un'immagine diversa da quella con cui il chatflow L2/L2.5 e' stato
    # validato, senza che nessun commit lo registri. 3.1.4 e' l'ultima
    # stabile al momento di questa milestone (verificato via Docker Hub,
    # vedi docs/logbook_fase5.md per il dettaglio) — da aggiornare
    # deliberatamente (bump esplicito, non "latest" che si aggiorna da
    # solo) quando serve una versione piu' recente.
    # [M7] Build locale invece di `image: flowiseai/flowise:3.1.4` diretta:
    # applica il fix a connect-sqlite3 (vedi ops/docker/flowise/Dockerfile)
    # senza cui il container non arriva nemmeno a "healthy". Stessa base
    # e stessa versione pinnata, solo quel modulo e' patchato.
    build: ./ops/docker/flowise
    image: caliper-flowise:3.1.4-patched
    container_name: caliper-flowise
    restart: always
    networks: [caliper-ai]
    ports:
      - "${FLOWISE_PORT:-3000}:${FLOWISE_PORT:-3000}"
    environment:
      PORT: ${FLOWISE_PORT:-3000}
      FLOWISE_USERNAME: ${FLOWISE_USERNAME:-}
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD:-}
      FLOWISE_SECRETKEY_OVERWRITE: ${FLOWISE_SECRETKEY_OVERWRITE:-}
      # [run1] La protezione SSRF di Flowise 3.1.4 blocca gli IP privati:
      # qui Ollama e' su rete docker interna (http://ollama:11434) e senza
      # questo il chatflow L2.5 non puo' chiamarlo — scoperto sul pod
      # (stessa topologia logica), sarebbe esploso a M7. Vedi
      # docs/logbook_fase6.md.
      HTTP_SECURITY_CHECK: "false"
    volumes:
      - flowise_data:/root/.flowise
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${FLOWISE_PORT:-3000}/api/v1/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - ollama
      - qdrant

  # ---------------- Provisioning — importa i chatflow versionati ----------------
  # One-shot, idempotente: se FLOWISE_API_KEY non è ancora impostata (prima
  # del primo login/creazione chiave, vedi README) esce senza errore e va
  # rilanciato a mano dopo: docker compose up flowise-init
  flowise-init:
    image: python:3.11-slim
    container_name: caliper-flowise-init
    networks: [caliper-ai]
    volumes:
      - ./services/flowise:/app:ro
    working_dir: /app
    environment:
      FLOWISE_URL: http://flowise:${FLOWISE_PORT:-3000}
      FLOWISE_API_KEY: ${FLOWISE_API_KEY:-}
    command: ["python", "import_chatflows.py"]
    restart: "no"
    depends_on:
      flowise:
        condition: service_healthy

  # ---------------- Interfaccia di chat — interroga il Livello 7 ----------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: caliper-open-webui
    restart: unless-stopped
    networks: [caliper-ai]
    ports:
      - "${OPEN_WEBUI_PORT:-3010}:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      # Il RAG proprio di Open WebUI non serve: il grounding vero è
      # stream-agent+Qdrant (Livello 7). Senza questa riga Open WebUI
      # scarica al primo avvio un secondo stack di embedding da
      # HuggingFace (sentence-transformers/all-MiniLM-L6-v2, ~90s) che
      # non useremo mai — qui puntiamo il suo RAG all'Ollama già in
      # esecuzione nello stack, riusando granite-embedding:30m invece.
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: ${OLLAMA_EMBED_MODEL:-granite-embedding:30m}
      RAG_OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama
      - stream-agent

  # ---------------- Proxy Docker in sola lettura — per la dashboard ----------------
  # Unico container che tocca /var/run/docker.sock. La sicurezza sta nelle
  # variabili d'ambiente qui sotto (ACL del proxy stesso), non nel flag
  # ":ro" sul mount — quel flag protegge solo il file del socket da essere
  # sostituito, non limita le operazioni raggiungibili attraverso di esso.
  # CONTAINERS=1 + LOGS=1 abilitano solo GET su lista/inspect/log;
  # POST=0 blocca esplicitamente ogni azione di scrittura.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: caliper-docker-proxy
    restart: unless-stopped
    networks: [caliper-ai]
    environment:
      CONTAINERS: 1
      LOGS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------- Dashboard — entry point verso lo stack ----------------
  # Sostituisce la vecchia landing-page statica: mostra lo stato (via
  # health-check server-side) e i log (via docker-socket-proxy) di ogni
  # servizio, ordinati per livello di pipeline. Nessun controllo di
  # avvio/stop/restart per scelta esplicita — vedi
  # services/dashboard/app.py e la voce di rischio corrispondente in
  # docs/architettura-prototipo-mesh-llm.md.
  dashboard:
    build: ./services/dashboard
    container_name: caliper-dashboard
    restart: unless-stopped
    networks: [caliper-ai, caliper-public]
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    environment:
      FLOWISE_PORT: ${FLOWISE_PORT:-3000}
      OPEN_WEBUI_PORT: ${OPEN_WEBUI_PORT:-3010}
      DOCKER_PROXY_URL: http://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy

  # ---------------- Livello 4 — slicing ----------------
  # CLI batch, non un servizio long-running: non parte con "docker compose
  # up" di default (profilo "tools"), si invoca on-demand con
  # "docker compose run prusaslicer ...". Nessuna rete necessaria.
  # [M7] Verificato dal vivo (era un TODO, mount "dedotti, mai
  # confermati"): l'immagine ha entrypoint di default /bin/bash (inutile
  # qui, "--help" veniva interpretato da bash stesso), il binario reale e'
  # /app/prusa-slicer (non "prusa-slicer-console" come ipotizzato nel
  # commento del profilo caliper-pla.ini) — PrusaSlicer 2.9.2. I path di
  # mount sotto erano gia' corretti (confermati), l'entrypoint no.
  prusaslicer:
    image: billa05/prusacli:latest
    container_name: caliper-prusaslicer
    entrypoint: ["/app/prusa-slicer"]
    profiles: ["tools"]
    network_mode: "none"
    volumes:
      - ${DATA_DIR:-./data}/models:/models
      - ${DATA_DIR:-./data}/gcode:/gcode
      - ./config/prusaslicer:/config:ro
