name: Regression — script di verifica (collaudo virtuale)

# Il progetto non ha una suite di test automatica integrata (vedi
# docs/architettura-prototipo-mesh-llm.md, v12/v14): ogni milestone del
# Ciclo di Collaudo Virtuale (docs/logbook.md, M1-M3) ha prodotto script
# di verifica eseguibili a mano, rieseguiti manualmente ad ogni revisione
# invece che tenuti automaticamente verdi. Con 12 script accumulati tra
# M1/M2/M3, il costo di rieseguirli tutti a mano ad ogni cambiamento e'
# diventato reale — questo workflow li esegue automaticamente su ogni
# push/PR verso develop, cosi' una regressione si nota subito e non alla
# prossima revisione manuale.
#
# Ogni step e' uno script separato ed esplicito (non un ciclo su
# verify_*.py trovati per pattern): coerente con la disciplina gia'
# applicata nel resto del progetto (preset.json esplicito per feature,
# non un'euristica generica — vedi issue #10) e rende visibile QUALE
# script fallisce direttamente nella UI di Actions, senza dover aprire i
# log.

on:
  push:
    # [M5, C10 — vedi docs/review_tecnica.md] Prima di M5 la CI girava
    # solo su develop: i branch delle sessioni (claude/**) non
    # eseguivano la regressione finche' non aprivano una PR verso
    # develop — una regressione introdotta a meta' sessione restava
    # invisibile fino a quel momento. "pull_request: branches: [develop]"
    # resta invariato (una PR gia' copre il push sul branch sorgente).
    branches: [develop, "claude/**"]
  pull_request:
    branches: [develop]

jobs:
  verify-scripts:
    runs-on: ubuntu-latest
    # Budget generoso: TC2 (sweep elicoidale completo) misura da solo
    # ~65s di CPU-time (vedi docs/logbook_fase2.md) su hardware di
    # sviluppo — runner CI piu' lenti/condivisi possono richiedere di
    # piu'. Il timeout qui e' una rete di sicurezza per il job nel suo
    # complesso, non il timeout applicativo (quello vive nel codice
    # stesso, gia' tarato empiricamente — vedi gauge_check.py).
    timeout-minutes: 20
    env:
      # [fix, primo run reale] Il primo tentativo di questo workflow e'
      # fallito: verify_gauge_check_tc2.py ucciso da SIGKILL a ~33s di
      # wall-clock su ubuntu-latest — il limite CPU interno di
      # gauge_check.py (100s, GAUGE_CHECK_CPU_LIMIT_SECONDS, tarato in
      # M2 su hardware di sviluppo con piu' core disponibili) viene
      # raggiunto molto piu' in fretta su un runner GitHub Actions piu'
      # debole/condiviso. Non e' un difetto del codice applicativo, ne'
      # si tocca il valore di default usato in produzione (rimane 100s
      # nel container reale, vedi gauge_check.py) — qui si allarga solo
      # il budget del test harness per l'hardware di CI, tramite la
      # stessa variabile d'ambiente gia' prevista per l'override (vedi
      # gauge_check.py, GAUGE_CHECK_CPU_LIMIT_SECONDS). Valore non
      # scelto a intuito ma con margine ampio sopra il caso gia'
      # osservato fallire a 100s teorici in ~33s reali — se dovesse
      # rivelarsi ancora insufficiente, il fix e' rialzare questo
      # numero, misurato sul prossimo fallimento reale, non indovinato.
      GAUGE_CHECK_CPU_LIMIT_SECONDS: "400"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # libgl1: dipendenza di OCP/CadQuery (vedi
      # services/verifier/executor/Dockerfile, stessa immagine base
      # python:3.11-slim + libgl1 usata in produzione).
      - name: Installa dipendenze di sistema (libgl1, richiesta da CadQuery/OCC)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1

      # Stessa versione fissata nel Dockerfile di verifier-executor.
      # pip install diretto: docker build verso Docker Hub e' bloccato da
      # policy in alcuni ambienti sandbox (vedi docs/logbook_fase1.md) -
      # gli hosted runner di GitHub Actions non hanno questa restrizione,
      # ma pip diretto resta comunque piu' veloce di una build Docker
      # completa per eseguire solo questi script.
      - name: Installa CadQuery
        run: pip install --default-timeout=300 cadquery==2.8.0

      # [M5] verify_stream_agent_ids.py e verify_result_variable_annassign.py
      # importano rispettivamente services/stream-agent/app.py e
      # services/verifier/app.py — nessuna istanza Qdrant/Ollama viva
      # richiesta (vedi le loro docstring), ma le dipendenze devono
      # essere installabili per l'import. Stesse versioni dei rispettivi
      # requirements.txt.
      - name: Installa dipendenze di stream-agent/verifier (fastapi, qdrant-client, requests)
        run: pip install --default-timeout=300 fastapi==0.115.0 qdrant-client==1.11.1 requests==2.32.3 pydantic==2.9.2 uvicorn==0.30.6

      # --- M1 (docs/logbook_fase1.md) ---
      - name: verify_gauge_check.py — M1, geometria sintetica
        working-directory: services/verifier/executor
        run: python verify_gauge_check.py

      - name: verify_gauge_check_real_gauges.py — M1, calibri M6 reali
        working-directory: services/verifier/executor
        run: python verify_gauge_check_real_gauges.py

      # --- M2 (docs/logbook_fase2.md) ---
      - name: verify_gauge_check_tc1.py — M2, TC1 accoppiamento albero-mozzo
        working-directory: services/verifier/executor
        run: python verify_gauge_check_tc1.py

      - name: verify_gauge_check_tc2.py — M2, TC2 filettatura (sweep elicoidale)
        working-directory: services/verifier/executor
        run: python verify_gauge_check_tc2.py

      - name: verify_gauge_check_tc3.py — M2, TC3 snap-fit
        working-directory: services/verifier/executor
        run: python verify_gauge_check_tc3.py

      - name: verify_retry_policy.py — M2, contratto di retry (mock)
        working-directory: services/orchestrator
        run: python verify_retry_policy.py

      # --- M3 (docs/logbook_fase3.md) ---
      - name: verify_run_and_measure_export.py — M3, export STEP
        working-directory: services/verifier/executor
        run: python verify_run_and_measure_export.py

      - name: verify_gauge_check_part_source.py — M3, radici models/generated
        working-directory: services/verifier/executor
        run: python verify_gauge_check_part_source.py

      - name: verify_sketch_schema.py — M3, validazione vincoli 2D
        working-directory: services/orchestrator
        run: python verify_sketch_schema.py

      - name: verify_sketch_compiler_thread.py — M3, compilatore + collaudo Go/No-Go
        working-directory: services/orchestrator
        run: python verify_sketch_compiler_thread.py

      - name: verify_sketch_first_strategy.py — M3, strategia L2 sketch-first (mock)
        working-directory: services/orchestrator
        run: python verify_sketch_first_strategy.py

      - name: verify_gauge_check_loop_wiring.py — M3, collegamento /gauge-check nel retry loop (mock)
        working-directory: services/orchestrator
        run: python verify_gauge_check_loop_wiring.py

      # --- M4 (docs/logbook_fase4.md) ---
      - name: verify_virtual_memory.py — M4, regola anti-bias (corroborazione fisica)
        working-directory: services/orchestrator
        run: python verify_virtual_memory.py

      - name: verify_virtual_memory_loop_gate.py — M4, gate anti-bias nel loop reale (mock rete)
        working-directory: services/orchestrator
        run: python verify_virtual_memory_loop_gate.py

      # --- M5 (docs/logbook_fase5.md) — fix pack post-review, docs/review_tecnica.md ---
      # Nota: verify_gauge_check_loop_wiring.py (C2, TC-M5-2) e
      # verify_virtual_memory.py (C5, TC-M5-6) sono stati ESTESI da M5
      # con nuovi scenari, non duplicati qui — i loro step sono gia'
      # sopra, nelle sezioni M3/M4 (eseguono la versione aggiornata).
      - name: verify_dimensional_contract.py — M5/C1, contratto dimensionale per-feature (TC-M5-1)
        working-directory: services/verifier/executor
        run: python verify_dimensional_contract.py

      - name: verify_snap_fit_min_distance_wiring.py — M5/C3, snap_fit/min_distance nel loop (TC-M5-3)
        working-directory: services/orchestrator
        run: python verify_snap_fit_min_distance_wiring.py

      - name: verify_stream_agent_ids.py — M5/C6, id Qdrant deterministici + offset persistito (TC-M5-4)
        working-directory: services/stream-agent
        run: python verify_stream_agent_ids.py

      - name: verify_verdict_integrity.py — M5/C7, split esecuzione/verdetto (TC-M5-5)
        working-directory: services/verifier/executor
        run: python verify_verdict_integrity.py

      - name: verify_param_first.py — M5/C4, strategia param_first + fix tolleranze sketch-first (TC-M5-7)
        working-directory: services/orchestrator
        run: python verify_param_first.py

      - name: verify_result_variable_annassign.py — M5/C10, result_variable accetta AnnAssign (TC-M5-8)
        working-directory: services/verifier
        run: python verify_result_variable_annassign.py

      - name: verify_generated_parts_cleanup.py — M5/C10, cleanup /exec/parts con ritenzione
        working-directory: services/verifier/executor
        run: python verify_generated_parts_cleanup.py
