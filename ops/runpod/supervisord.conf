; CALIPER — process tree del pod RunPod (immagine caliper-pod).
;
; Stessi componenti del docker-compose.yml, come processi in un unico
; container (i pod RunPod non hanno Docker-in-Docker — vedi
; docs/piano_recupero.md §3/M6). DIVERGENZA DICHIARATA dalla topologia
; di produzione: qui verifier-executor NON e' isolato in un container
; senza rete (restano i RLIMIT per-job di run_and_measure/gauge_check);
; le verifiche di isolamento attive sono scope M7 sulla RTX 3090.
; La dashboard e il docker-socket-proxy non girano nel pod (senza Docker
; non hanno niente da mostrare/proteggere).
;
; Log: /workspace/logs/<programma>.log — inclusi nell'harvest.

[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
pidfile=/workspace/supervisord.pid

; Controllo runtime via supervisorctl (lezione dell'incidente del run0,
; docs/logbook_runpod_run0.md: un kill al supervisord "principale" —
; PID 1 via exec in start.sh — ha buttato giu' l'intero container).
; Con il socket si fa `supervisorctl restart flowise` senza toccare il
; processo master. Socket su /run (tmpfs), NON su /workspace: i socket
; unix su MooseFS non sono affidabili.
[unix_http_server]
file=/run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:ollama]
command=/usr/bin/ollama serve
environment=OLLAMA_MODELS="/workspace/ollama-models",OLLAMA_HOST="0.0.0.0:11434"
stdout_logfile=/workspace/logs/ollama.log
redirect_stderr=true
autorestart=true
priority=10

[program:qdrant]
command=/opt/qdrant/qdrant
directory=/opt/qdrant
environment=QDRANT__STORAGE__STORAGE_PATH="/workspace/qdrant/storage",QDRANT__STORAGE__SNAPSHOTS_PATH="/workspace/qdrant/snapshots"
stdout_logfile=/workspace/logs/qdrant.log
redirect_stderr=true
autorestart=true
priority=10

[program:flowise]
; NOTA (run0): FLOWISE_USERNAME/PASSWORD qui sotto NON hanno effetto su
; Flowise 3.x (sistema di account con registrazione + JWT, DB su
; /workspace/flowise/database.sqlite — l'account admin si crea una volta
; via UI e persiste sul volume). Restano innocue, tolte solo quando si
; potra' verificare su un pod che nulla le legge.
; HTTP_SECURITY_CHECK=false [run1]: Flowise 3.1.4 ha una protezione
; SSRF di default che blocca le chiamate verso localhost/IP privati —
; ma nel pod (e nel compose, M7) e' esattamente li' che vive Ollama per
; il chatflow L2.5. Osservato dal vivo: senza questo, L2.5 non puo'
; chiamare il modello. Disattivazione ufficiale documentata da Flowise.
command=/usr/bin/flowise start
environment=PORT="3000",FLOWISE_USERNAME="%(ENV_FLOWISE_USERNAME)s",FLOWISE_PASSWORD="%(ENV_FLOWISE_PASSWORD)s",DATABASE_PATH="/workspace/flowise",APIKEY_PATH="/workspace/flowise",SECRETKEY_PATH="/workspace/flowise",LOG_PATH="/workspace/flowise/logs",FLOWISE_SECRETKEY_OVERWRITE="%(ENV_FLOWISE_SECRETKEY_OVERWRITE)s",HTTP_SECURITY_CHECK="false"
stdout_logfile=/workspace/logs/flowise.log
redirect_stderr=true
autorestart=true
startsecs=15
priority=20

[program:verifier]
command=/opt/venv/bin/uvicorn app:app --host 0.0.0.0 --port 8600
directory=/workspace/caliper-cad/services/verifier
stdout_logfile=/workspace/logs/verifier.log
redirect_stderr=true
autorestart=true
priority=30

[program:verifier-executor]
; watcher.py lancia "python /app/run_and_measure.py|gauge_check.py":
; /app e' un symlink al checkout (vedi start.sh), PATH mette il venv
; davanti cosi' "python" risolve all'interprete con cadquery.
command=/opt/venv/bin/python watcher.py
directory=/workspace/caliper-cad/services/verifier/executor
environment=PATH="/opt/venv/bin:/usr/local/bin:/usr/bin:/bin",GENERATED_PARTS_DIR="/workspace/exec/parts"
stdout_logfile=/workspace/logs/verifier-executor.log
redirect_stderr=true
autorestart=true
priority=30

[program:stream-agent]
command=/opt/venv/bin/uvicorn app:app --host 0.0.0.0 --port 8500
directory=/workspace/caliper-cad/services/stream-agent
environment=OLLAMA_BASE_URL="http://localhost:11434",QDRANT_URL="http://localhost:6333",DATASET_DIR="/workspace/data/dataset",VIRTUAL_LOG_PATH="/workspace/data/virtual_log/retry_log.jsonl",OLLAMA_CHAT_MODEL="granite4:1b",OLLAMA_EMBED_MODEL="granite-embedding:30m"
stdout_logfile=/workspace/logs/stream-agent.log
redirect_stderr=true
autorestart=true
priority=40
